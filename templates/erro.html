{% extends "base.html" %}
{% block titulo %}{{ codigo }} · Talhão em Dia{% endblock %}
{% block conteudo %}
<div class="caixa erro-pagina">
  <p class="erro-codigo">{{ codigo }}</p>
  <h1>{{ mensagem }}</h1>
  {% if codigo == 403 %}
  <p>A tentativa ficou registrada no log.</p>
  {% endif %}
  <p><a href="{{ url_for('inicio.landing') }}">Voltar pro início</a></p>
</div>
{% endblock %}
