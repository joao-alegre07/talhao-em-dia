# Compose da stack de produção no Portainer. A stack não está ligada a um
# repositório Git (ver "Deploy" no README): este arquivo vai pro editor dela,
# colado na mão ou mandado pelo workflow junto com a IMAGE_TAG.
# As variáveis abaixo vêm do campo "Environment variables" do Portainer no momento
# do deploy -- nenhum valor real fica gravado neste arquivo nem no repositório.
#
# As imagens não são buildadas no servidor: o GitHub Actions builda, testa e
# publica no GHCR com a tag sha-<commit>. Sem IMAGE_TAG definido, cai no latest.
#
# Todos os serviços ficam na rede padrão do projeto (criada automaticamente pelo
# Compose, sem precisar declarar nada) -- de propósito, pra reaproveitar a rede
# que já existe desde o primeiro deploy em vez de pedir uma sub-rede nova ao
# Docker (o servidor é compartilhado com a turma inteira e o pool de sub-redes
# livres é limitado).
#
# app, auth e log têm HEALTHCHECK no próprio Dockerfile (batendo no /health de
# cada um); Redis e Garage, que são imagens de terceiros, têm o healthcheck aqui.
services:
  app:
    image: ghcr.io/joao-alegre07/talhao-em-dia-app:${IMAGE_TAG:-latest}
    ports:
      - "8212:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      AUTH_SERVICE_URL: http://auth:5001
      LOG_SERVICE_URL: http://log:5002
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      auth:
        condition: service_started
      log:
        condition: service_started
      garage:
        condition: service_healthy
    restart: unless-stopped

  # Serviço de autenticação: login, cadastro, papéis (role) e esqueci-senha.
  # Sem "ports:" de propósito -- só acessível pela rede do projeto, nunca
  # publicado pro host. O app é o único ponto de entrada público.
  auth:
    image: ghcr.io/joao-alegre07/talhao-em-dia-auth:${IMAGE_TAG:-latest}
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      LOG_SERVICE_URL: http://log:5002
    depends_on:
      - log
    restart: unless-stopped

  # Serviço de auditoria: recebe os eventos do app e do auth e grava
  # num Redis Stream. Também sem porta publicada -- a consulta dos logs
  # passa pelo app, na rota /admin/logs, que só admin acessa.
  log:
    image: ghcr.io/joao-alegre07/talhao-em-dia-log:${IMAGE_TAG:-latest}
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Só o log-service fala com o Redis. O appendonly faz o Redis gravar cada
  # escrita em disco, então os eventos sobrevivem a um restart do container.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Object storage das receitas das aplicações (Garage, compatível com S3, no
  # lugar do MinIO). Também sem porta publicada: o app envia os arquivos e as
  # URLs assinadas chegam no navegador passando pela rota /arquivos do app.
  # O --default-bucket cria o bucket e a chave de acesso no primeiro boot a
  # partir das variáveis GARAGE_DEFAULT_*.
  garage:
    image: ghcr.io/joao-alegre07/talhao-em-dia-garage:${IMAGE_TAG:-latest}
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - garage_data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  redis_data:
  garage_data:
